<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under the Radar — a stock podcast</title>
<meta name="description" content="A daily deep dive into overlooked, under-the-radar stocks, with a weekly recap and week-ahead preview.">
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --text: #e9f2ee;
    --muted: #8fb3a4;
    --accent: #42f5aa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 48px 20px 24px;
  }
  .hero img {
    width: 180px;
    height: 180px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    margin-bottom: 20px;
  }
  h1 { margin: 0 0 6px; font-size: 28px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
  .links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .links a {
    color: var(--bg);
    background: var(--accent);
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 14px;
  }
  .links a.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid #2a3540;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
  }
  .episode {
    background: var(--panel);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .episode h2 { font-size: 17px; margin: 0 0 6px; }
  .episode .meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .episode p { font-size: 14px; line-height: 1.5; color: #cdd9d3; margin: 0 0 12px; white-space: pre-wrap; }
  audio { width: 100%; margin-bottom: 10px; }
  .transcript-link {
    display: inline-block;
    color: var(--accent);
    font-size: 13px;
    text-decoration: none;
    font-weight: 600;
  }
  .transcript-link:hover { text-decoration: underline; }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 20px 50px; }
</style>
</head>
<body>
  <div class="hero">
    <img src="cover.jpg" alt="Under the Radar cover art">
    <h1>Under the Radar</h1>
    <p class="subtitle">Small stocks nobody's talking about yet — a daily deep dive, weekly recap &amp; week-ahead preview.</p>
    <div class="links">
      <a href="feed.xml">RSS Feed</a>
      <a class="secondary" href="https://podcasters.spotify.com/">Spotify</a>
      <a class="secondary" href="https://podcastsconnect.apple.com/">Apple Podcasts</a>
    </div>
  </div>
  <main id="episodes">
    <div class="empty">Loading episodes…</div>
  </main>
  <footer>Not financial advice. Automatically produced.</footer>

  <script>
    async function loadEpisodes() {
      const container = document.getElementById('episodes');
      try {
        const res = await fetch('feed.xml', { cache: 'no-store' });
        const text = await res.text();
        const xml = new DOMParser().parseFromString(text, 'application/xml');
        const items = Array.from(xml.querySelectorAll('item'));
        if (!items.length) {
          container.innerHTML = '<div class="empty">No episodes published yet. Check back soon.</div>';
          return;
        }
        container.innerHTML = items.map(item => {
          const title = item.querySelector('title')?.textContent ?? 'Episode';
          const desc = item.querySelector('description')?.textContent ?? '';
          const enclosure = item.querySelector('enclosure');
          const audioUrl = enclosure ? enclosure.getAttribute('url') : '';
          const pubDate = item.querySelector('pubDate')?.textContent ?? '';
          const niceDate = pubDate ? new Date(pubDate).toDateString() : '';
          // podcast:transcript is a namespaced tag; getElementsByTagName
          // matches on the literal "podcast:transcript" tag name here,
          // which works across browsers for a feed parsed this way.
          const transcriptEl = item.getElementsByTagName('podcast:transcript')[0];
          const transcriptUrl = transcriptEl ? transcriptEl.getAttribute('url') : '';
          return `
            <div class="episode">
              <h2>${title}</h2>
              <div class="meta">${niceDate}</div>
              <p>${desc}</p>
              ${audioUrl ? `<audio controls preload="none" src="${audioUrl}"></audio>` : ''}
              ${transcriptUrl ? `<a class="transcript-link" href="${transcriptUrl}" target="_blank" rel="noopener">Read transcript →</a>` : ''}
            </div>`;
        }).join('');
      } catch (e) {
        container.innerHTML = '<div class="empty">Could not load episodes right now.</div>';
      }
    }
    loadEpisodes();
  </script>
</body>
</html>
